<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SagaShop</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar" id="nav"></header>
  <main class="page">
    <div class="hero">
      <div><h1 id="hello">Xin chào!</h1><p>Mua sắm dễ dàng, thanh toán bằng ví SagaShop.</p></div>
      <div class="wallet"><span>Số dư ví</span><b id="myBalance">…</b></div>
    </div>
    <div class="grid shop2">
      <section><h2>Sản phẩm</h2><div id="products" class="products"></div></section>
      <div class="grid">
        <section class="card">
          <h2>Đơn hàng của tôi</h2>
          <div class="chips" id="filters">
            <button data-f="all" class="chip active">Tất cả</button><button data-f="ok" class="chip">Thành công</button>
            <button data-f="cancel" class="chip">Đã hủy</button><button data-f="busy" class="chip">Đang xử lý</button>
          </div>
          <div id="myOrders"></div>
        </section>
        <section class="card"><h2>Lịch sử ví</h2><div id="myTx"></div></section>
      </div>
    </div>
  </main>
  <script src="app.js"></script>
  <script>
    $("nav").innerHTML = navbar("shop", `<div class="me"><select id="me"><option value="alice">Alice</option><option value="bob">Bob</option><option value="carol">Carol</option></select><span class="avatar" id="avatar">A</span></div>`);
  </script>
  <script src="shop.js"></script>
</body>
</html>
